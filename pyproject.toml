[project]
name = "checksum-kit-py"
version = "0.1.1"
description = "Streaming CRC-32 and Adler-32 checksums for Python, with no third-party dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
